# Production defaults for a single k3s VPS. Applied together with the
# server-only values-server.yaml and secrets.yaml by deploy/server-update.sh.

image:
  repository: ghcr.io/CHANGE_ME/spendyholik-backend   # set in values-server.yaml
  pullPolicy: IfNotPresent      # tags are commit SHAs, so they never change

replicaCount: 1

ingress:
  enabled: true
  className: traefik
  # Stage 1 (no domain yet): empty — the API answers on http://<VPS_IP>/.
  # Stage 2: set host and tls.enabled in values-server.yaml.
  host: ""
  tls:
    enabled: false
    secretName: spendyholik-api-tls
    clusterIssuer: letsencrypt-prod

env:
  DJANGO_SETTINGS_MODULE: config.settings.production
  ALLOWED_HOSTS: "CHANGE_ME_VPS_IP"   # set in values-server.yaml
  CORS_ALLOWED_ORIGINS: ""
  CSRF_TRUSTED_ORIGINS: ""
  # Plain-HTTP stage. Switch to "true" / "true" / "31536000" in values-server.yaml once HTTPS works.
  SECURE_SSL_REDIRECT: "false"
  SECURE_COOKIES: "false"
  SECURE_HSTS_SECONDS: "0"
  LOG_LEVEL: INFO
  EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
