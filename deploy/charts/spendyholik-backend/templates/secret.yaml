{{- $fullname := include "spendyholik-backend.fullname" . -}}
{{- $s := .Values.secrets -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-secret
  labels:
    {{- include "spendyholik-backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ required "secrets.SECRET_KEY is required" $s.SECRET_KEY | quote }}
  EMAIL_HOST_PASSWORD: {{ $s.EMAIL_HOST_PASSWORD | quote }}
  {{- if .Values.postgresql.enabled }}
  {{- $pg := .Values.postgresql }}
  {{- $pgPassword := required "secrets.POSTGRES_PASSWORD is required" $s.POSTGRES_PASSWORD }}
  POSTGRES_PASSWORD: {{ $pgPassword | quote }}
  DATABASE_URL: {{ printf "postgres://%s:%s@%s-postgres:5432/%s" $pg.username $pgPassword $fullname $pg.database | quote }}
  {{- else }}
  DATABASE_URL: {{ required "secrets.DATABASE_URL is required when postgresql.enabled=false" $s.DATABASE_URL | quote }}
  {{- end }}
  {{- if .Values.redis.enabled }}
  {{- $redisPassword := required "secrets.REDIS_PASSWORD is required" $s.REDIS_PASSWORD }}
  REDIS_PASSWORD: {{ $redisPassword | quote }}
  REDIS_URL: {{ printf "redis://:%s@%s-redis:6379/0" $redisPassword $fullname | quote }}
  {{- else }}
  REDIS_URL: {{ required "secrets.REDIS_URL is required when redis.enabled=false" $s.REDIS_URL | quote }}
  {{- end }}
