{{- if .Values.redis.enabled }}
{{- $fullname := include "spendyholik-backend.fullname" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-redis
  labels:
    {{- include "spendyholik-backend.labels" . | nindent 4 }}
    component: redis
spec:
  selector:
    {{- include "spendyholik-backend.selectorLabels" . | nindent 4 }}
    component: redis
  ports:
    - name: redis
      port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-redis
  labels:
    {{- include "spendyholik-backend.labels" . | nindent 4 }}
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "spendyholik-backend.selectorLabels" . | nindent 6 }}
      component: redis
  template:
    metadata:
      labels:
        {{- include "spendyholik-backend.selectorLabels" . | nindent 8 }}
        component: redis
    spec:
      {{- with .Values.appArmorProfile }}
      securityContext:
        appArmorProfile:
          type: Localhost
          localhostProfile: {{ . }}
      {{- end }}
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          # Broker + cache only: no persistence needed.
          args: ["--requirepass", "$(REDIS_PASSWORD)", "--save", "", "--appendonly", "no"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-secret
                  key: REDIS_PASSWORD
          ports:
            - containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 5
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
{{- end }}
