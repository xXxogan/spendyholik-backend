{{- if .Values.ingress.enabled }}
{{- $ing := .Values.ingress -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "spendyholik-backend.fullname" . }}
  labels:
    {{- include "spendyholik-backend.labels" . | nindent 4 }}
  {{- if and $ing.tls.enabled $ing.tls.clusterIssuer }}
  annotations:
    cert-manager.io/cluster-issuer: {{ $ing.tls.clusterIssuer | quote }}
  {{- end }}
spec:
  ingressClassName: {{ $ing.className }}
  {{- if $ing.tls.enabled }}
  tls:
    - hosts: [{{ required "ingress.host is required for TLS" $ing.host | quote }}]
      secretName: {{ $ing.tls.secretName }}
  {{- end }}
  rules:
    - {{- if $ing.host }}
      host: {{ $ing.host | quote }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "spendyholik-backend.fullname" . }}-api
                port:
                  name: http
{{- end }}
