{{- if .Values.postgresql.enabled }}
{{- $fullname := include "spendyholik-backend.fullname" . -}}
{{- $pg := .Values.postgresql -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-postgres
  labels:
    {{- include "spendyholik-backend.labels" . | nindent 4 }}
    component: postgres
spec:
  clusterIP: None
  selector:
    {{- include "spendyholik-backend.selectorLabels" . | nindent 4 }}
    component: postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-postgres
  labels:
    {{- include "spendyholik-backend.labels" . | nindent 4 }}
    component: postgres
spec:
  serviceName: {{ $fullname }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "spendyholik-backend.selectorLabels" . | nindent 6 }}
      component: postgres
  template:
    metadata:
      labels:
        {{- include "spendyholik-backend.selectorLabels" . | nindent 8 }}
        component: postgres
    spec:
      # Start directly as the image's postgres user (uid 999) so the entrypoint
      # does not have to drop privileges with gosu (one moving part fewer).
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        {{- with .Values.appArmorProfile }}
        appArmorProfile:
          type: Localhost
          localhostProfile: {{ . }}
        {{- end }}
      containers:
        - name: postgres
          image: {{ $pg.image }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ $pg.database | quote }}
            - name: POSTGRES_USER
              value: {{ $pg.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ $pg.username | quote }}, "-d", {{ $pg.database | quote }}]
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ $pg.username | quote }}]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml $pg.resources | nindent 12 }}
          volumeMounts:
            # postgres:18 keeps its data in a versioned subdirectory of this path.
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ $pg.persistence.storageClass }}
        resources:
          requests:
            storage: {{ $pg.persistence.size }}
{{- end }}
