apiVersion: v1
kind: Service
metadata:
  name: {{ include "spendyholik-backend.fullname" . }}-api
  labels:
    {{- include "spendyholik-backend.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "spendyholik-backend.selectorLabels" . | nindent 4 }}
    component: api
  ports:
    - name: http
      port: 80
      targetPort: 8000
