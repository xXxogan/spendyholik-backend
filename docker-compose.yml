# Local backing services: `docker compose up -d`, then
# TEST_DATABASE_URL=postgres://spendyholik:spendyholik@localhost:5432/spendyholik uv run pytest
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: spendyholik
      POSTGRES_PASSWORD: spendyholik
      POSTGRES_DB: spendyholik
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "spendyholik"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8
    ports: ["6379:6379"]

volumes:
  pgdata:
