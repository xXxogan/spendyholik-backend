[project]
name = "spendyholik-backend"
version = "0.1.0"
description = "REST API backend for the «SpendyHolik» personal finance app (clean architecture)"
readme = "README.md"
authors = [{ name = "Xogan" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    # django-celery-beat 2.9 caps Django at <6.1.
    "django>=6.0.9,<6.1",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "social-auth-app-django>=7.1",
    "psycopg[binary]>=3.3.6",
    "redis>=8.1",
    "celery>=5.6",
    "django-celery-beat>=2.9",
    "pydantic>=2.14",
    "drf-spectacular>=0.30",
    "django-cors-headers>=4.9",
    "structlog>=26.1",
    "django-prometheus>=2.5",
    "django-environ>=0.14",
    "django-ratelimit>=4.1",
    "pillow>=13.0",
    "gunicorn>=26.2",
    "uvicorn[standard]>=0.54",
    "argon2-cffi>=25.1",
    "python-dateutil>=2.9",
    "whitenoise>=6.9",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-django>=4.14",
    "pytest-cov>=7.1",
    "pytest-sugar>=1.1",
    "factory-boy>=3.3.3",
    "faker>=40.43",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers --tb=short"
markers = [
    "unit: unit tests without database",
    "integration: repository/infrastructure tests",
    "api: interface/API contract tests",
    "e2e: end-to-end scenarios",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:django.*",
    # python3-openid (via social-auth-core) imports the deprecated defusedxml.cElementTree.
    "ignore:defusedxml.cElementTree is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "N"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Generated by makemigrations.
"**/migrations/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["src"]
omit = ["*/migrations/*"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
