name: CD

# After CI passes on main: build the image, push it to GHCR, then SSH into the
# VPS and run deploy/server-update.sh for that commit. Secrets stay on the
# server; GitHub only holds the SSH key. See DEPLOY.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Never run two deploys at once; queue them instead.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Image name and tag
        id: meta
        run: |
          sha="$(git rev-parse HEAD)"
          owner="${GITHUB_REPOSITORY_OWNER,,}"   # GHCR names must be lowercase
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$owner/spendyholik-backend" >> "$GITHUB_OUTPUT"
          echo "tag=${sha:0:7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Set the repository variable IMAGE_PLATFORMS=linux/arm64 for an ARM VPS.
          platforms: ${{ vars.IMAGE_PLATFORMS || 'linux/amd64' }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # Skipped until the server is set up and the VPS_HOST variable exists.
    if: vars.VPS_HOST != ''
    runs-on: ubuntu-latest
    steps:
      - name: Update the server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: ~/spendyholik_backend/deploy/server-update.sh ${{ needs.build.outputs.sha }}
